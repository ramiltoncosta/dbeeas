# Ambiente de DESENVOLVIMENTO (seu computador)
# Uso: docker compose up --build
#
#   Site ................ http://localhost:5173
#   API (documentação) .. http://localhost:8000/docs
#   E-mails de teste .... http://localhost:8025
#   Detector (direto) ... http://localhost:8001/docs
#
#   Ver a fila trabalhando: docker compose logs -f worker
#
# ":Z" nos volumes é necessário no Fedora por causa do SELinux.

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: dbeeas
      POSTGRES_PASSWORD: dbeeas
      POSTGRES_DB: dbeeas
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbeeas"]
      interval: 5s
      retries: 10

  # Fila de processamento das fotos
  redis:
    image: redis:7-alpine

  # Captura os e-mails do sistema (nada é enviado de verdade)
  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "8025:8025"

  # Sua API de detecção (YOLO). Fica só para uso interno do sistema.
  detector:
    build: ./api
    ports:
      - "8001:8000"
    volumes:
      - ./models:/models:ro,Z
    environment:
      MODEL_PATH: /models/best.pt
      MIN_CONFIDENCE: "0.50"

  backend:
    build:
      context: ./backend
      args:
        DEV: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app:Z # o código muda sem precisar reconstruir
      - arquivos:/data/arquivos
    environment: &ambiente-backend
      DATABASE_URL: postgresql+psycopg://dbeeas:dbeeas@db:5432/dbeeas
      REDIS_URL: redis://redis:6379/0
      DETECTOR_URL: http://detector:8000
      FRONTEND_URL: http://localhost:5173
      CORS_ORIGENS: http://localhost:5173
      SMTP_HOST: mailpit
      SMTP_PORTA: "1025"
      SMTP_TLS: "false"
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # Worker: pega as fotos da fila, gera miniaturas e chama o detector
  worker:
    build:
      context: ./backend
      args:
        DEV: "true"
    volumes:
      - ./backend:/app:Z
      - arquivos:/data/arquivos
    environment: *ambiente-backend
    command: rq worker --url redis://redis:6379/0 --with-scheduler fotos exportacoes
    depends_on:
      backend:
        condition: service_started

  frontend:
    image: node:22-alpine
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app:Z
      - /app/node_modules # as bibliotecas ficam dentro do contêiner
    environment:
      VITE_API_URL: http://localhost:8000
    command: sh -c "npm install && npm run dev"

volumes:
  dbdata:
  arquivos: # fotos e miniaturas
